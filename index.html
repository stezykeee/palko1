<!--
  Palkó Marcsi lángosa – webshop (Nagykátai piac)
  Egyetlen fájl: HTML + CSS + JavaScript, külső függőség nélkül.

  Gyors útmutató a szerkesztéshez:
    • Cégadatok, cím, telefon, árak, nyitvatartás, feltétek, allergének → keresd: "ÜZLETI ADATOK"
    • Minden felületi szöveg (magyar és angol)                              → keresd: "FELÜLETI SZÖVEGEK"
    • Impresszum, ÁSZF, adatkezelési tájékoztató, akadálymentesség          → keresd: "JOGI SZÖVEGEK"
    • Színek (világos/sötét téma)                                          → keresd: "SZÍNEK"
    • Rendelés elküldése (élesítéskor ide kell a backend vagy e-mail-küldés) → keresd: "Élesítéskor"
-->

  <script>
    /* Téma beállítása betöltés előtt, hogy ne villanjon */
    (function () {
      try {
        var t = localStorage.getItem("pm-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

        if (localStorage.getItem("pm-lang") === "en") document.documentElement.lang = "en";

  <style>
/* =====================================================================
   SZÍNEK / COLOURS  –  világos és sötét téma
===================================================================== */
:root {
  --bg: #f6f4ef;
  --surface: #fdfcfa;
  --ink: #1b1815;
  --muted: #5d564e;
  --line: #d9d4ca;
  --field: #857d73;
  --accent: #a3301d;
  --dough: #efdcb2;
  --ok: #2e5a2b;
  --backdrop: rgba(27, 24, 21, 0.45);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161412; --surface: #1e1b18; --ink: #ece7df; --muted: #a8a096; --line: #36312b; --field: #80776c;
    --accent: #ec8f74; --dough: #3a3024; --ok: #9fcf94; --backdrop: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161412; --surface: #1e1b18; --ink: #ece7df; --muted: #a8a096; --line: #36312b; --field: #80776c;
  --accent: #ec8f74; --dough: #3a3024; --ok: #9fcf94; --backdrop: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* =====================================================================
   ALAP / BASE
===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
html:has(dialog[open]) { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1.0625rem/1.55 var(--sans);
}
h1, h2, h3, h4, p, ul, ol, dl, dd, figure, fieldset { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
legend { padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
img, svg { max-width: 100%; }
::selection { background: var(--dough); color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); }
.muted { color: var(--muted); }
.small { font-size: 0.9375rem; }
.serif { font-family: var(--serif); font-weight: 400; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }

.skip {
  position: fixed; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 100;
  background: var(--ink); color: var(--bg); padding: 10px 16px; text-decoration: none; transform: translateY(-200%);
}
.skip:focus { transform: none; }

/* Gombok / buttons — laposak, árnyék nélkül */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); border-radius: 2px;
  background: transparent; color: var(--ink); font-weight: 600; font-size: 0.9688rem; text-decoration: none; cursor: pointer;
}
.btn:hover { background: var(--ink); color: var(--bg); }
.btn-solid { background: var(--ink); color: var(--bg); }
.btn-solid:hover { background: transparent; color: var(--ink); }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 0.9375rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.swap { display: inline-grid; place-items: center; overflow: hidden; }
.swap > span { grid-area: 1 / 1; white-space: nowrap; }
.swap-b { opacity: 0; transform: translateY(110%); }
.swap.is-added .swap-a { opacity: 0; transform: translateY(-110%); }
.swap.is-added .swap-b { opacity: 1; transform: none; }
.btn-solid.swap.is-added { background: transparent; color: var(--ink); }
.link {
  display: inline-flex; align-items: center; min-height: 32px; padding: 0; border: 0; background: none; cursor: pointer;
  color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; font-weight: 500;
}
.link:hover { text-decoration-thickness: 2px; }

/* =====================================================================
   FEJLÉC / HEADER
===================================================================== */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid transparent;
}
.site-header.is-scrolled { border-bottom-color: var(--line); }
.header-in { display: flex; align-items: center; gap: 24px; min-height: 68px; }
.brand { text-decoration: none; margin-right: auto; line-height: 1.15; padding: 6px 0; }
.brand b { display: block; font: 400 1.375rem/1.1 var(--serif); }
.brand span { display: block; font-size: 0.8125rem; color: var(--muted); }
.nav ul { display: flex; gap: 22px; }
.nav a { position: relative; text-decoration: none; font-size: 0.9688rem; padding: 10px 0; display: inline-block; }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 1px; background: var(--ink); transform: scaleX(0); transform-origin: left; }
.nav a:hover::after, .nav a.is-current::after { transform: scaleX(1); }
.tools { display: flex; align-items: center; gap: 16px; }
.cart-btn .count-box { display: inline-block; overflow: hidden; vertical-align: bottom; line-height: 1.25; }
.cart-btn .count { display: inline-block; font-variant-numeric: tabular-nums; }
.nav-toggle { display: none; }
@media (max-width: 880px) {
  .header-in { flex-wrap: wrap; gap: 8px 16px; }
  .nav-toggle { display: inline-flex; }
  .nav { order: 3; width: 100%; display: none; padding-bottom: 12px; }
  .nav.is-open { display: block; }
  .nav ul { flex-direction: column; gap: 0; }
  .nav a { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .tools .theme-btn, .tools .lang-btn { display: none; }
  .nav .mobile-tools { display: flex; gap: 20px; padding-top: 12px; }
}
@media (min-width: 881px) { .nav .mobile-tools { display: none; } }

/* =====================================================================
   SZEKCIÓK / SECTIONS
===================================================================== */
.section { padding: clamp(64px, 9vw, 112px) 0; border-top: 1px solid var(--line); }
.section-grid { display: grid; grid-template-columns: 1fr; gap: 28px 48px; }
@media (min-width: 900px) { .section-grid { grid-template-columns: 4fr 8fr; } }
.section-grid > * { min-width: 0; }
.h2 { font: 400 clamp(1.875rem, 3.4vw, 2.625rem)/1.1 var(--serif); letter-spacing: -0.005em; }
.lead { font-size: 1.125rem; color: var(--muted); max-width: 56ch; }

/* Nyitó / hero */
.hero { padding: clamp(48px, 8vw, 104px) 0 clamp(48px, 7vw, 88px); }
.hero-grid { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: center; }
@media (min-width: 900px) { .hero-grid { grid-template-columns: 7fr 5fr; } }
.status { font-size: 0.9375rem; color: var(--muted); }
.status b { color: var(--ink); font-weight: 600; }
.status span { white-space: nowrap; }
.h1 { font: 400 clamp(2.5rem, 6.2vw, 4.75rem)/1.04 var(--serif); letter-spacing: -0.015em; max-width: 13ch; margin-top: 20px; }
.hero .lead { margin-top: 24px; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 32px; }
.drawing { width: min(380px, 80%); justify-self: center; color: var(--ink); }
.drawing .dough { fill: var(--dough); }
.drawing .cream { fill: #fbf6ec; }
.drawing .cheese { stroke: #b4831f; }
.facts { display: grid; grid-template-columns: 1fr; gap: 0; margin-top: clamp(48px, 7vw, 80px); }
@media (min-width: 700px) { .facts { grid-template-columns: repeat(3, 1fr); gap: 32px; } }
.facts li { border-top: 1px solid var(--ink); padding: 14px 0 18px; }
.facts b { display: block; font-weight: 600; }
.facts span { color: var(--muted); font-size: 0.9688rem; }

/* Lángosok / menu */
.toolbar { display: grid; gap: 18px; margin-top: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.filters button {
  border: 0; background: none; padding: 8px 0; min-height: 40px; cursor: pointer; font-size: 0.9688rem;
  border-bottom: 1px solid transparent; color: var(--muted);
}
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { color: var(--ink); border-bottom: 2px solid var(--ink); font-weight: 600; }
.toolbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; font-size: 0.9375rem; }
.toolbar-row legend, .toolbar-row .label { color: var(--muted); margin-right: 4px; float: left; padding: 10px 14px 0 0; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; margin-right: 18px; cursor: pointer; }
.check input, .choice input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); flex: none; }
select {
  min-height: 40px; padding: 0 34px 0 10px; border: 1px solid var(--field); border-radius: 2px; background-color: var(--surface);
  appearance: none; -webkit-appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat;
}
.result-count { margin-top: 40px; font-size: 0.9375rem; color: var(--muted); }
.menu-list { display: grid; grid-template-columns: 1fr; column-gap: 56px; margin-top: 12px; }
@media (min-width: 820px) { .menu-list { grid-template-columns: 1fr 1fr; column-gap: 72px; } }
.item { border-top: 1px solid var(--line); padding: 22px 0 24px; }
.item-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.item-head h3 { font: 400 1.375rem/1.2 var(--serif); }
.item-price { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item-desc { margin-top: 6px; color: var(--muted); max-width: 46ch; }
.item-meta { margin-top: 8px; font-size: 0.875rem; color: var(--muted); }
.fav { color: var(--accent); font-weight: 600; }
.item-actions { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
.empty { padding: 32px 0; border-top: 1px solid var(--line); }

/* Átvétel / info */
.info-cols { display: grid; grid-template-columns: 1fr; gap: 28px; }
@media (min-width: 700px) { .info-cols { grid-template-columns: repeat(3, 1fr); } }
.info-cols h3, .h3 { font-weight: 600; font-size: 1.0625rem; }
.info-cols p { margin-top: 6px; color: var(--muted); }
.hours { margin-top: 48px; max-width: 460px; }
.hours table { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
.hours th, .hours td { text-align: left; font-weight: 400; padding: 9px 0; border-bottom: 1px solid var(--line); }
.hours td { text-align: right; }
.hours tr.is-today th, .hours tr.is-today td { font-weight: 700; }

/* Rólam / about */
.about p + p { margin-top: 16px; }
.about p { font-size: 1.125rem; max-width: 60ch; }

/* Allergének / tables */
.table-scroll { position: relative; overflow-x: auto; margin-top: 28px; }
.table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 0.9688rem; }
.table caption { text-align: left; font-weight: 600; padding-bottom: 10px; }
.table th, .table td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.table thead th { font-weight: 600; color: var(--muted); font-size: 0.875rem; border-bottom-color: var(--ink); }
.table tbody th { font-weight: 400; }
.table .c { text-align: center; padding-right: 0; width: 13%; }
.legend { columns: 2 220px; column-gap: 32px; margin-top: 12px; }
.legend li { padding: 4px 0; break-inside: avoid; }
.legend b { display: inline-block; min-width: 1.8em; font-variant-numeric: tabular-nums; }

/* Kérdések / FAQ */
.faq details { border-top: 1px solid var(--line); }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary {
  list-style: none; cursor: pointer; padding: 16px 32px 16px 0; position: relative; font-weight: 600;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::before, .faq summary::after {
  content: ""; position: absolute; right: 6px; top: 50%; width: 13px; height: 1.5px; background: currentColor;
}
.faq summary::after { transform: rotate(90deg); }
.faq details[open] summary::after { transform: rotate(0deg); }
.faq details p { padding: 0 0 18px; color: var(--muted); max-width: 62ch; }

/* Lábléc / footer */
.footer { border-top: 1px solid var(--ink); padding: 48px 0 40px; font-size: 0.9375rem; }
.footer-grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
@media (min-width: 760px) { .footer-grid { grid-template-columns: 1.3fr 1fr 1fr 1fr; } }
.footer h2 { font-size: 0.9375rem; font-weight: 600; margin-bottom: 8px; }
.footer p, .footer li { color: var(--muted); }
.footer li + li { margin-top: 2px; }
.footer-bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.875rem; }

/* =====================================================================
   ABLAKOK / DIALOGS
===================================================================== */
dialog {
  padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--ink);
  width: min(640px, calc(100% - 24px)); max-height: calc(100dvh - 24px); overflow: auto; overscroll-behavior: contain;
}
dialog::backdrop { background: var(--backdrop); }
dialog.drawer {
  margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(440px, 100%); border-radius: 0; border-width: 0 0 0 1px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 0; }
.d-head h2 { font: 400 1.75rem/1.15 var(--serif); }
.d-body { padding: 16px 24px 24px; }
.d-foot {
  position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 24px; background: var(--surface); border-top: 1px solid var(--line);
}
.group { margin-top: 26px; }
.group > legend, .group > .h3 { font-weight: 600; font-size: 1.0625rem; margin-bottom: 4px; }
.help { font-size: 0.875rem; color: var(--muted); margin-top: 4px; }
.choice { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.choice:first-of-type { border-top: 1px solid var(--line); }
.choice .grow { flex: 1; }
.choice small { color: var(--muted); font-size: 0.875rem; margin-left: 6px; }
.choice .price { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.choice.keep:has(input:not(:checked)) .grow { text-decoration: line-through; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--field); border-radius: 2px; }
.stepper button { width: 40px; height: 40px; border: 0; background: none; cursor: pointer; font-size: 1.125rem; }
.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
.stepper output, .stepper .q { min-width: 2.2em; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.field { margin-top: 16px; }
.field label { display: block; font-weight: 600; font-size: 0.9688rem; margin-bottom: 6px; }
.req { color: var(--accent); }
.input, textarea.input {
  display: block; width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--field); border-radius: 2px; background: var(--bg);
}
textarea.input { min-height: 80px; resize: vertical; }
.input[aria-invalid="true"] { border: 2px solid var(--accent); }
.error { color: var(--accent); font-size: 0.9375rem; font-weight: 600; margin-top: 6px; }
.error-box { border: 2px solid var(--accent); padding: 14px 16px; margin-top: 16px; }
.error-box ul { list-style: disc; padding-left: 20px; margin-top: 4px; }
.row2 { display: grid; gap: 0 16px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .row2 { grid-template-columns: 1fr 1fr; } .row2.zip { grid-template-columns: 8rem 1fr; } }
.lines li { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.lines .name { font-weight: 600; }
.lines .detail { grid-column: 1 / -1; font-size: 0.875rem; color: var(--muted); }
.lines .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; margin-top: 6px; }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; margin-top: 16px; font-variant-numeric: tabular-nums; }
.totals dd { text-align: right; }
.totals .grand { font-weight: 700; font-size: 1.125rem; padding-top: 8px; border-top: 1px solid var(--ink); margin-top: 6px; }
.notice { border-left: 2px solid var(--line); padding: 4px 0 4px 12px; color: var(--muted); font-size: 0.9375rem; margin-top: 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 20px; border-bottom: 1px solid var(--line); margin-top: 12px; }
.tabs button { border: 0; background: none; padding: 10px 0; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.legal h3 { font-weight: 600; margin-top: 22px; }
.legal p { margin-top: 6px; max-width: 70ch; }
.legal .doc-title { font: 400 1.5rem/1.2 var(--serif); margin-top: 20px; }

/* =====================================================================
   ANIMÁCIÓK / MOTION
   Rövidek és visszafogottak. Ha a rendszer csökkentett mozgást kér,
   egyik sem fut (minden azonnal a végállapotában jelenik meg).
===================================================================== */
@media (prefers-reduced-motion: no-preference) {
  body, .site-header { transition: background-color .25s ease, color .25s ease; }
  .btn { transition: background-color .15s ease, color .15s ease, transform .1s ease; }
  .btn:active { transform: translateY(1px); }
  .link { transition: text-decoration-color .15s ease, text-decoration-thickness .15s ease; }
  .filters button { transition: color .15s ease; }
  .nav a::after { transition: transform .28s cubic-bezier(.2, .7, .2, 1); }
  .site-header { transition: border-color .2s ease, background-color .25s ease; }

  /* Kosárba gomb: a felirat felcsúszik, megjelenik a „Hozzáadva ✓” */
  .swap > span { transition: transform .32s cubic-bezier(.2, .7, .2, 1), opacity .2s ease; }

  /* Kosár darabszám: az új szám beúszik */
  .count.tick-up { animation: tick-up .34s cubic-bezier(.2, .7, .2, 1); }
  .count.tick-down { animation: tick-down .34s cubic-bezier(.2, .7, .2, 1); }

  /* Nyitóoldal: első betöltéskor a szöveg finoman felúszik, a rajz „megrajzolódik” */
  .intro .in { animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--d, 0) * 90ms + 60ms); }
  .intro .draw { stroke-dasharray: 1; animation: draw var(--dl, .6s) cubic-bezier(.55, .1, .3, 1) both; animation-delay: var(--dd, 0s); }
  .intro .dough { animation-name: draw, fill-in; animation-duration: var(--dl), .7s; animation-delay: var(--dd), .95s; animation-fill-mode: both; }

  .section.reveal > .wrap { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .7s cubic-bezier(.2, .7, .2, 1); }
  .section.reveal.is-in > .wrap { opacity: 1; transform: none; }

  /* Lángoslista: szűréskor a tételek egymás után jelennek meg */
  .item { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 35ms); }

  dialog.drawer.is-closing { animation: drawer-out .19s ease-in forwards; }

const pad = (n) => String(n).padStart(2, "0");

function openStatus(now) {
    const today = HOURS[now.getDay()];
    const mins = now.getHours() * 60 + now.getMinutes();
    if (today && mins >= today[0] * 60 && mins < today[1] * 60)
        return { open: true, closeAt: hhmm(today[1]) };
    for (let d = 0; d < 8; d++) {
        const date = new Date(now);
        date.setDate(now.getDate() + d);
        const h = HOURS[date.getDay()];
        if (!h)
            continue;
        if (d === 0 && mins >= h[0] * 60)
            continue;
        return { open: false, inDays: d, weekday: date.getDay(), openAt: hhmm(h[0]) };
    }
    return { open: false, inDays: 1, weekday: 2, openAt: "10:00" };

function orderSlots(now) {
    for (let d = 0; d < 8; d++) {
        const date = new Date(now);
        date.setDate(now.getDate() + d);
        date.setHours(0, 0, 0, 0);
        const h = HOURS[date.getDay()];
        if (!h)
            continue;
        let start = h[0] * 60 + 30;
        const end = h[1] * 60 - 15;
        if (d === 0) {
            const earliest = now.getHours() * 60 + now.getMinutes() + 30;
            start = Math.max(start, Math.ceil(earliest / 15) * 15);
        }
        if (start > end)
            continue;
        const slots = [];
        for (let m = start; m <= end; m += 15) {
            const label = hhmm(Math.floor(m / 60), m % 60);
            slots.push({ value: `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${label}`, label });

        const nowMins = now.getHours() * 60 + now.getMinutes();
        const todayH = HOURS[now.getDay()];
        const asap = d === 0 && !!todayH && nowMins >= todayH[0] * 60 && nowMins + 30 <= todayH[1] * 60;
        return { inDays: d, weekday: date.getDay(), slots, asap };
    }
    return { inDays: 0, weekday: now.getDay(), slots: [], asap: false };

  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* nincs tárhely */ } },
  };

  /* Animációk: csak ha a rendszer nem kér csökkentett mozgást */
  const motionOK = () => !window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const later = (fn, ms) => (motionOK() ? setTimeout(fn, ms) : fn());

  /* ---------- állapot / state ---------- */
  const state = {
    lang: store.get("pm-lang") === "en" ? "en" : "hu",
    cart: loadCart(),
    filter: "all",
    exclude: [],
    sort: "rec",
    navOpen: false,
  };
  let T = TEXTS[state.lang];

  function makeMoney() {
    const nf = new Intl.NumberFormat(T.locale, { style: "currency", currency: "HUF", minimumFractionDigits: 0, maximumFractionDigits: 0 });
    return (n) => nf.format(n);
  }
  const L = (obj) => obj[state.lang];

  /* ---------- kosár / cart ---------- */
  function loadCart() {
    try {
      const raw = store.get("pm-cart-v2");
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list.filter((l) => PRODUCT_BY_ID[l.productId] && l.qty > 0) : [];
    } catch (e) { return []; }
  }
  const saveCart = () => store.set("pm-cart-v2", JSON.stringify(state.cart));
  const cartCount = () => state.cart.reduce((s, l) => s + l.qty, 0);
  const cartTotal = () => state.cart.reduce((s, l) => s + unitPrice(l) * l.qty, 0);

  function addLine(cfg, qty) {
    const key = lineKey(cfg);
    const ex = state.cart.find((l) => l.key === key);
    if (ex) ex.qty = Math.min(30, ex.qty + qty);
    else state.cart.push(Object.assign({}, cfg, { key, qty }));
    cartChanged();
  }
  function replaceLine(oldKey, cfg, qty) {
    const idx = state.cart.findIndex((l) => l.key === oldKey);
    state.cart = state.cart.filter((l) => l.key !== oldKey);
    const key = lineKey(cfg);
    const ex = state.cart.find((l) => l.key === key);
    if (ex) ex.qty = Math.min(30, ex.qty + qty);
    else state.cart.splice(idx < 0 ? state.cart.length : idx, 0, Object.assign({}, cfg, { key, qty }));
    cartChanged();
  }
  function setQty(key, qty) {
    if (qty <= 0) state.cart = state.cart.filter((l) => l.key !== key);
    else { const l = state.cart.find((x) => x.key === key); if (l) l.qty = Math.min(30, qty); }
    cartChanged();
  }
  function cartChanged() {
    saveCart();
    renderCartButton(true);
    if ($("#cart-dialog").open) renderCart();
  }

  /* ---------- képernyőolvasó-bejelentés / announcements ---------- */
  function announce(msg) {
    const el = $("#live");
    el.textContent = "";
    setTimeout(() => { el.textContent = msg; }, 50);
  }

  /* Újrarajzolás úgy, hogy a fókusz megmaradjon (azonos id alapján). */
  function renderInto(el, html) {
    const id = document.activeElement && el.contains(document.activeElement) ? document.activeElement.id : null;
    el.innerHTML = html;
    if (id) { const again = document.getElementById(id); if (again) again.focus(); else return false; }
    return true;
  }

  /* ---------- ablakok / dialogs ---------- */
  const returnFocus = new Map();
  function openDialog(dlg, trigger) {
    returnFocus.set(dlg, trigger || document.activeElement);
    if (!dlg.open) dlg.showModal();
    const first = dlg.querySelector("[data-autofocus]") || dlg.querySelector("h2");
    if (first) { if (!first.hasAttribute("tabindex") && first.tagName === "H2") first.setAttribute("tabindex", "-1"); first.focus(); }
  }
  function closeDialog(dlg, instant) {
    if (!dlg.open || dlg.classList.contains("is-closing")) return;
    if (instant || !motionOK()) { dlg.close(); return; }
    dlg.classList.add("is-closing");
    setTimeout(() => { dlg.classList.remove("is-closing"); dlg.close(); }, 190);
  }
  $$("dialog").forEach((dlg) => {
    dlg.addEventListener("close", () => {
      const el = returnFocus.get(dlg);
      if (dlg.id === "checkout-dialog") onCheckoutClosed();
      const target = el && (document.contains(el) ? el : el.id ? document.getElementById(el.id) : null);
      if (target) target.focus();
    });
    dlg.addEventListener("click", (e) => { if (e.target === dlg) closeDialog(dlg); });
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); closeDialog(dlg); });
  });

    const b = $("#cart-btn");

  /* ---------- lángoslista / menu ---------- */
  function filteredProducts() {
    const list = PRODUCTS.filter((p) => {
      const d = dietOf(p.base), al = allergensOf(p.base), f = state.filter;
      if (f === "savory" && p.kind !== "savory") return false;
      if (f === "sweet" && p.kind !== "sweet") return false;
      if (f === "veg" && !d.veg) return false;
      if (f === "vegan" && !d.vegan) return false;
      if (f === "spicy" && !d.spicy) return false;
      return !state.exclude.some((a) => al.includes(a));
    });
    const s = state.sort;
    return list.sort((a, b) => (s === "asc" ? a.price - b.price : s === "desc" ? b.price - a.price : 0) || a.rank - b.rank);
  }

  const allergenText = (list) =>
    list.length ? list.map((a) => `${esc((ALLERGEN_SHORT[a] ? L(ALLERGEN_SHORT[a]) : L(ALLERGENS[a - 1].name)).toLowerCase())} (${a})`).join(", ") : esc(T.product.none);

  function dietText(ings, kind) {
    const d = dietOf(ings), out = [];
    if (d.vegan) out.push(T.diet.vegan); else if (d.veg) out.push(T.diet.veg);
    if (d.spicy) out.push(T.diet.spicy);
    if (kind === "sweet") out.push(T.diet.sweet);
    return out.join(", ");
  }

  function updateProduct() {
    const ings = lineIngredients(pd.cfg);
    const p = PRODUCT_BY_ID[pd.cfg.productId];
    const total = money(unitPrice(pd.cfg) * pd.qty);
    const diet = dietText(ings, p.kind);
    $("#pd-diet").textContent = diet ? cap(diet) + "." : "";
    $("#pd-alg").innerHTML = allergenText(allergensOf(ings)) + ".";
    $("#pd-qty").textContent = pd.qty;
    $("#pd-dec").disabled = pd.qty <= 1;
    $("#pd-inc").disabled = pd.qty >= 30;
    $("#pd-note-help").textContent = T.product.noteHelp(140 - pd.cfg.note.length);
    $("#pd-submit").textContent = pd.editKey ? T.product.save(total) : T.product.add(total);
  }

  $("#product-dialog").addEventListener("change", (e) => {
    const t = e.target;
    if (t.name === "size") pd.cfg.size = t.value;
    if (t.name === "keep") pd.cfg.removed = t.checked ? pd.cfg.removed.filter((x) => x !== t.value) : pd.cfg.removed.concat(t.value);
    if (t.name === "extra") pd.cfg.extras = t.checked ? pd.cfg.extras.concat(t.value) : pd.cfg.extras.filter((x) => x !== t.value);
    updateProduct();
  });
  $("#product-dialog").addEventListener("input", (e) => {
    if (e.target.name === "note") { pd.cfg.note = e.target.value; updateProduct(); }
  });
  $("#product-dialog").addEventListener("submit", (e) => {
    e.preventDefault();
    const cfg = Object.assign({}, pd.cfg, { note: pd.cfg.note.trim() });
    const name = L(PRODUCT_BY_ID[cfg.productId].name);
    if (pd.editKey) { replaceLine(pd.editKey, cfg, pd.qty); announce(T.cartUi.updated); }
    else { addLine(cfg, pd.qty); announce(T.cartUi.added(name, cartCount())); }
    closeDialog($("#product-dialog"));
  });

  /* =================================================================
     RENDELÉS / CHECKOUT
  ================================================================= */
  const co = {
    method: "pickup", time: "", slots: null, pay: "cash",
    f: { name: "", phone: "", email: "", zip: "", city: "", street: "", floor: "", courier: "" },
    terms: false, privacy: false, newsletter: false, errors: {}, done: null,
  };
  const phoneOk = (v) => { const s = v.replace(/[\s\-()/.]/g, ""); return /^(\+36|06)\d{8,9}$/.test(s) || /^\+\d{8,15}$/.test(s); };
  const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());
  const dayWord = (inDays, wd) => (inDays === 0 ? T.checkout.dayToday : inDays === 1 ? T.checkout.dayTomorrow : T.info.days[wd].toLowerCase());
  const fee = () => (co.method === "delivery" && cartTotal() < FREE_DELIVERY_FROM ? DELIVERY_FEE : 0);

  function timeLabel() {
    if (co.time === "asap") return T.checkout.asap;
    const s = co.slots && co.slots.slots.find((x) => x.value === co.time);
    return s ? `${dayWord(co.slots.inDays, co.slots.weekday)} ${s.label}` : "";
  }

  function openCheckout(trigger) {
    co.slots = orderSlots(new Date());
    if (!co.time || (co.time !== "asap" && !co.slots.slots.some((s) => s.value === co.time)) || (co.time === "asap" && !co.slots.asap)) {
      co.time = co.slots.asap ? "asap" : (co.slots.slots[0] ? co.slots.slots[0].value : "");
    }
    co.errors = {};
    renderCheckout();
    openDialog($("#checkout-dialog"), trigger);
  }

  function fieldHtml(k, label, o) {
    o = o || {};
    const err = co.errors[k];
    const desc = [o.help ? `co-${k}-help` : "", err ? `co-${k}-err` : ""].filter(Boolean).join(" ");
    const attrs = `id="co-${k}" name="${k}" ${o.area ? "" : `type="${o.type || "text"}"`} ${o.auto ? `autocomplete="${o.auto}"` : ""} ${o.mode ? `inputmode="${o.mode}"` : ""} ${o.max ? `maxlength="${o.max}"` : ""} ${o.req ? 'aria-required="true"' : ""} ${err ? 'aria-invalid="true"' : ""} ${desc ? `aria-describedby="${desc}"` : ""}`;
    return `<div class="field">
      <label for="co-${k}">${esc(label)}${o.req ? ' <span class="req" aria-hidden="true">*</span>' : ""}</label>
      ${o.area ? `<textarea class="input" ${attrs}>${esc(co.f[k])}</textarea>` : `<input class="input" ${attrs} value="${esc(co.f[k])}">`}
      ${o.help ? `<p class="help" id="co-${k}-help">${esc(o.help)}</p>` : ""}
      ${err ? `<p class="error" id="co-${k}-err">${esc(err)}</p>` : ""}
    </div>`;
  }

  function checkHtml(k, label, extra) {
    const err = co.errors[k];
    return `<div class="field">
      <label class="check" style="align-items:flex-start;margin:0;font-weight:400">
        <input type="checkbox" id="co-${k}" name="${k}" ${co[k] ? "checked" : ""} ${err ? `aria-invalid="true" aria-describedby="co-${k}-err"` : ""} style="margin-top:3px">
        <span>${esc(label)}${k !== "newsletter" ? ' <span class="req" aria-hidden="true">*</span>' : ""}</span>
      </label>
      ${extra || ""}
      ${err ? `<p class="error" id="co-${k}-err">${esc(err)}</p>` : ""}
    </div>`;
  }

  function addressHtml() {
    if (co.method !== "delivery") return "";
    return `<div class="row2 zip">${fieldHtml("zip", T.checkout.zip, { req: true, auto: "postal-code", mode: "numeric", max: 4 })}${fieldHtml("city", T.checkout.city, { req: true, auto: "address-level2" })}</div>
      ${fieldHtml("street", T.checkout.street, { req: true, auto: "address-line1" })}
      ${fieldHtml("floor", T.checkout.floor, { auto: "address-line2" })}
      ${fieldHtml("courier", T.checkout.courier, { area: true, max: 200 })}`;
  }

  function summaryHtml() {
    const sub = cartTotal(), f = fee();
    return `<ul class="lines">${state.cart.map((l) => `<li><span class="name">${l.qty} × ${esc(L(PRODUCT_BY_ID[l.productId].name))}</span><span class="num">${money(unitPrice(l) * l.qty)}</span><span class="detail">${lineDetail(l)}</span></li>`).join("")}</ul>
      <dl class="totals">
        <dt>${esc(T.checkout.subtotal)}</dt><dd>${money(sub)}</dd>
        ${co.method === "delivery" ? `<dt>${esc(T.checkout.deliveryFee)}</dt><dd>${f ? money(f) : esc(T.checkout.free)}</dd>` : ""}
        <dt class="grand">${esc(T.checkout.total)}</dt><dd class="grand">${money(sub + f)}</dd>
      </dl>`;
  }

  function renderCheckout() {
    const dlg = $("#checkout-dialog");
    if (co.done) return renderDone();
    if (!state.cart.length) {
      dlg.innerHTML = `<div class="d-head"><h2 id="co-title" tabindex="-1">${esc(T.checkout.title)}</h2><button type="button" class="link" data-action="close-dialog">${esc(T.close)}</button></div><div class="d-body"><p>${esc(T.cartUi.empty)}</p></div>`;
      return;
    }
    const s = co.slots;
    const errs = Object.entries(co.errors);
    const noTime = !s.asap && s.slots.length === 0;
    dlg.innerHTML = `
      <form id="co-form" novalidate>
        <div class="d-head"><h2 id="co-title" tabindex="-1">${esc(T.checkout.title)}</h2><button type="button" class="link" data-action="close-dialog">${esc(T.close)}</button></div>
        <div class="d-body">
          ${errs.length ? `<div class="error-box" id="co-errors" tabindex="-1" role="alert"><p><b>${esc(T.checkout.errTitle(errs.length))}</b></p><ul>${errs.map(([k, m]) => `<li><a href="#co-${k}" data-focus="co-${k}">${esc(m)}</a></li>`).join("")}</ul></div>` : ""}
          <p class="help" style="margin-top:4px">${esc(T.checkout.required)}</p>

          <fieldset class="group">
            <legend>${esc(T.checkout.how)}</legend>
            <label class="choice"><input type="radio" name="method" value="pickup" ${co.method === "pickup" ? "checked" : ""}><span class="grow">${esc(T.checkout.pickup)}<br><small style="margin:0">${esc(T.checkout.pickupNote(BUSINESS.address))}</small></span></label>
            <label class="choice"><input type="radio" name="method" value="delivery" ${co.method === "delivery" ? "checked" : ""}><span class="grow">${esc(T.checkout.delivery)}<br><small style="margin:0">${esc(T.checkout.deliveryNote(money(DELIVERY_FEE), money(FREE_DELIVERY_FROM)))}</small></span></label>
          </fieldset>

          <div class="field group">
            <label for="co-time">${esc(T.checkout.when)} <span class="req" aria-hidden="true">*</span></label>
            ${!s.asap && s.slots.length ? `<p class="help" id="co-time-help" style="margin:0 0 6px">${esc(T.checkout.closedNote)}</p>` : ""}
            ${noTime ? `<p class="error">${esc(T.checkout.noSlots)}</p>` : `
            <select id="co-time" name="time" aria-required="true" ${co.errors.time ? 'aria-invalid="true"' : ""} ${!s.asap ? 'aria-describedby="co-time-help"' : ""}>
              ${s.asap ? `<option value="asap" ${co.time === "asap" ? "selected" : ""}>${esc(T.checkout.asap)}</option>` : ""}
              ${s.slots.map((x) => `<option value="${x.value}" ${co.time === x.value ? "selected" : ""}>${esc(dayWord(s.inDays, s.weekday))} ${x.label}</option>`).join("")}
            </select>`}
            ${co.errors.time ? `<p class="error">${esc(co.errors.time)}</p>` : ""}
          </div>

          <fieldset class="group">
            <legend>${esc(T.checkout.contact)}</legend>
            ${fieldHtml("name", T.checkout.name, { req: true, auto: "name" })}
            <div class="row2">
              ${fieldHtml("phone", T.checkout.phone, { req: true, type: "tel", auto: "tel", mode: "tel", help: T.checkout.phoneHelp })}
              ${fieldHtml("email", T.checkout.email, { req: true, type: "email", auto: "email", mode: "email", help: T.checkout.emailHelp })}
            </div>
            <div id="co-address">${addressHtml()}</div>
          </fieldset>

          <fieldset class="group">
            <legend>${esc(T.checkout.payment)}</legend>
            ${["cash", "card", "szep"].map((p) => `<label class="choice"><input type="radio" name="pay" value="${p}" ${co.pay === p ? "checked" : ""}><span class="grow">${esc(T.checkout.pay[p])}</span></label>`).join("")}
          </fieldset>

          <div class="group">
            <h3 class="h3">${esc(T.checkout.summary)}</h3>
            <div id="co-summary">${summaryHtml()}</div>
          </div>

          <div class="group">
            ${checkHtml("terms", T.checkout.terms, `<button type="button" class="link small" style="margin-left:26px" data-action="legal" data-tab="terms" aria-haspopup="dialog">${esc(T.checkout.openTerms)}</button>`)}
            ${checkHtml("privacy", T.checkout.privacy, `<button type="button" class="link small" style="margin-left:26px" data-action="legal" data-tab="privacy" aria-haspopup="dialog">${esc(T.checkout.openPrivacy)}</button>`)}
            ${checkHtml("newsletter", T.checkout.newsletter)}
            <p class="notice">${esc(T.checkout.noWithdrawal)}</p>
          </div>
        </div>
        <div class="d-foot">
          <button type="button" class="link" data-action="back-to-cart">${esc(T.checkout.back)}</button>
          <button type="submit" class="btn btn-solid" ${noTime ? "disabled" : ""}>${esc(T.checkout.place)}</button>
        </div>
      </form>`;
  }

  function validate() {
    const E = T.checkout.err, e = {}, f = co.f;
    if (!co.time) e.time = E.time;
    if (f.name.trim().length < 3) e.name = E.name;
    if (!phoneOk(f.phone)) e.phone = E.phone;
    if (!emailOk(f.email)) e.email = E.email;
    if (co.method === "delivery") {
      if (!/^\d{4}$/.test(f.zip.trim())) e.zip = E.zip;
      if (!f.city.trim()) e.city = E.city;
      if (!f.street.trim()) e.street = E.street;
    }
    if (!co.terms) e.terms = E.terms;
    if (!co.privacy) e.privacy = E.privacy;
    return e;
  }

  function renderDone() {
    const d = co.done;
    $("#checkout-dialog").innerHTML = `
      <div class="d-head"><h2 id="co-title" tabindex="-1">${esc(T.checkout.doneTitle)}</h2><button type="button" class="link" data-action="close-dialog">${esc(T.close)}</button></div>
      <div class="d-body">
        <svg class="done-check" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="draw" pathLength="1" style="--dd:.1s" d="M10 25c4 3 7 7 10 11 6-10 12-18 19-25"/></svg>
        <p class="lead">${esc(T.checkout.doneLead)}</p>
        <dl class="totals" style="margin-top:24px">
          <dt>${esc(T.checkout.orderNo)}</dt><dd><b>${esc(d.no)}</b></dd>
          <dt>${esc(T.checkout.receive)}</dt><dd>${esc(d.method === "pickup" ? T.checkout.pickup : T.checkout.delivery)}</dd>
          <dt>${esc(T.checkout.time)}</dt><dd>${esc(d.time)}</dd>
          <dt class="grand">${esc(T.checkout.total)}</dt><dd class="grand">${money(d.total)}</dd>
        </dl>
        ${DEMO_MODE ? `<p class="notice">${esc(T.checkout.demo)}</p>` : `<p style="margin-top:16px">${esc(T.checkout.confirmSent(d.email))}</p>`}
        <p style="margin-top:24px"><button type="button" class="btn btn-solid" data-action="close-dialog">${esc(T.checkout.close)}</button></p>
      </div>`;
  }

  function onCheckoutClosed() {
    if (!co.done) return;
    state.cart = [];
    cartChanged();
    co.done = null; co.terms = false; co.privacy = false; co.newsletter = false; co.time = ""; co.errors = {};
    Object.keys(co.f).forEach((k) => (co.f[k] = ""));
  }

  const coDlg = $("#checkout-dialog");
  coDlg.addEventListener("input", (e) => {
    const t = e.target;
    if (t.name in co.f) co.f[t.name] = t.value;
  });
  coDlg.addEventListener("change", (e) => {
    const t = e.target;
    if (t.name === "method") { co.method = t.value; $("#co-address").innerHTML = addressHtml(); $("#co-summary").innerHTML = summaryHtml(); }
    if (t.name === "time") co.time = t.value;
    if (t.name === "pay") co.pay = t.value;
    if (t.name === "terms" || t.name === "privacy" || t.name === "newsletter") co[t.name] = t.checked;
  });
  coDlg.addEventListener("submit", (e) => {
    e.preventDefault();
    co.errors = validate();
    if (Object.keys(co.errors).length) {
      renderCheckout();
      $("#co-errors").focus();
      return;
    }
    /* ↓ Élesítéskor itt kell elküldeni a rendelést (pl. fetch('/api/order', …)). */
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    co.done = {
      no: `PM-${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${Math.floor(1000 + Math.random() * 9000)}`,
      total: cartTotal() + fee(), email: co.f.email.trim(), method: co.method, time: timeLabel(),
    };
    renderDone();
    $("#co-title").focus();
  });

  /* =================================================================
     JOGI INFORMÁCIÓK / LEGAL DIALOG
  ================================================================= */
  const LEGAL_TABS = ["impressum", "terms", "privacy", "a11y"];
  function openLegal(tab, trigger) {
    renderLegal(tab);
    openDialog($("#legal-dialog"), trigger);
  }
  function renderLegal(tab) {
    const docs = legalDocs(state.lang);
    const names = { impressum: T.footer.impressum, terms: T.footer.terms, privacy: T.footer.privacy, a11y: T.footer.a11y };
    const d = docs[tab];
    $("#legal-dialog").innerHTML = `
      <div class="d-head"><h2 id="legal-title" tabindex="-1">${esc(T.legalTitle)}</h2><button type="button" class="link" data-action="close-dialog">${esc(T.close)}</button></div>
      <div class="d-body legal">
        <div class="tabs" role="tablist" aria-labelledby="legal-title">
          ${LEGAL_TABS.map((k) => `<button type="button" role="tab" id="tab-${k}" aria-controls="legal-panel" aria-selected="${k === tab}" tabindex="${k === tab ? 0 : -1}" data-action="legal-tab" data-tab="${k}">${esc(names[k])}</button>`).join("")}
        </div>
        <div id="legal-panel" role="tabpanel" aria-labelledby="tab-${tab}" tabindex="0">
          <h3 class="doc-title">${esc(d.title)}</h3>
          <p class="help">${esc(d.updated)}</p>
          ${DEMO_MODE ? `<p class="notice">${esc(T.footer.demo)}</p>` : ""}
          ${d.sections.map((s) => `<h3>${esc(s.h)}</h3>${s.p.map((p) => `<p>${esc(p)}</p>`).join("")}`).join("")}
        </div>
      </div>`;
  }
  $("#legal-dialog").addEventListener("keydown", (e) => {
    const t = e.target;
    if (t.getAttribute("role") !== "tab" || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
    e.preventDefault();
    const i = LEGAL_TABS.indexOf(t.dataset.tab);
    const n = e.key === "Home" ? 0 : e.key === "End" ? LEGAL_TABS.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + LEGAL_TABS.length) % LEGAL_TABS.length;
    renderLegal(LEGAL_TABS[n]);
    $(`#tab-${LEGAL_TABS[n]}`).focus();
  });

  /* Kosártétel eltűnése: rövid elhalványulás, aztán törlés */
  function leave(btn, done) {
    const li = btn.closest("li");
    if (li) li.classList.add("is-leaving");
    later(done, 220);
  }

  /* =================================================================
     ESEMÉNYEK / EVENTS
  ================================================================= */
  document.addEventListener("click", (e) => {
    const a = e.target.closest("[data-action], [data-focus]");
    if (!a) return;
    if (a.dataset.focus) { e.preventDefault(); const el = document.getElementById(a.dataset.focus); if (el) el.focus(); return; }
    const act = a.dataset.action;
    const dlg = a.closest("dialog");
    switch (act) {
      case "lang":
        state.lang = state.lang === "hu" ? "en" : "hu";
        store.set("pm-lang", state.lang);
        T = TEXTS[state.lang]; money = makeMoney();
        renderAll();
        (document.getElementById(a.id) || $("#lang-btn")).focus();
        announce(state.lang === "hu" ? "Magyar nyelv" : "English");
        break;
      case "theme": {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        store.set("pm-theme", next);
        const label = next === "dark" ? T.toLight : T.toDark;
        $$("[data-action=theme]").forEach((b) => (b.textContent = label));
        break;
      }
      case "nav":
        state.navOpen = !state.navOpen;
        $("#nav").classList.toggle("is-open", state.navOpen);
        a.setAttribute("aria-expanded", String(state.navOpen));
        break;
      case "filter": state.filter = a.dataset.value; renderMenuList(); break;
      case "reset-filters": state.filter = "all"; state.exclude = []; state.sort = "rec"; renderMenu(); $("#flt-all").focus(); break;
      case "add": {
        addLine(defaultConfig(a.dataset.id), 1);
        announce(T.cartUi.added(L(PRODUCT_BY_ID[a.dataset.id].name), cartCount()));
        clearTimeout(a._t);
        a.classList.add("is-added");
        a._t = setTimeout(() => a.classList.remove("is-added"), 1500);
        break;
      }
      case "customize": openProduct(defaultConfig(a.dataset.id), 1, null, a); break;
      case "pd-dec": pd.qty = Math.max(1, pd.qty - 1); updateProduct(); break;
      case "pd-inc": pd.qty = Math.min(30, pd.qty + 1); updateProduct(); break;
      case "open-cart": renderCart(); openDialog($("#cart-dialog"), a); break;
      case "dec": case "inc": {
        const l = state.cart.find((x) => x.key === a.dataset.key);
        if (!l) break;
        const name = L(PRODUCT_BY_ID[l.productId].name);
        const q = l.qty + (act === "inc" ? 1 : -1);
        if (q <= 0) { leave(a, () => setQty(l.key, 0)); } else setQty(l.key, q);
        announce(q <= 0 ? T.cartUi.removed(name) : T.cartUi.qtyAria(name, q));
        break;
      }
      case "remove": {
        const l = state.cart.find((x) => x.key === a.dataset.key);
        if (!l) break;
        leave(a, () => setQty(l.key, 0));
        announce(T.cartUi.removed(L(PRODUCT_BY_ID[l.productId].name)));
        break;
      }
      case "edit": {
        const l = state.cart.find((x) => x.key === a.dataset.key);
        if (l) openProduct(l, l.qty, l.key, a);
        break;
      }
      case "checkout": closeDialog($("#cart-dialog"), true); openCheckout($("#cart-btn")); break;
      case "back-to-cart": closeDialog($("#checkout-dialog"), true); renderCart(); openDialog($("#cart-dialog"), $("#cart-btn")); break;
      case "legal": openLegal(a.dataset.tab, a); break;
      case "legal-tab": renderLegal(a.dataset.tab); $(`#tab-${a.dataset.tab}`).focus(); break;
      case "close-dialog": if (dlg) closeDialog(dlg); break;
    }
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.exclude) {
      const a = Number(t.dataset.exclude);
      state.exclude = t.checked ? state.exclude.concat(a) : state.exclude.filter((x) => x !== a);
      renderMenuList();
    }
    if (t.id === "sort") { state.sort = t.value; renderMenuList(); }
  });

  document.addEventListener("click", (e) => {
    const link = e.target.closest(".nav a");
    if (link) { state.navOpen = false; $("#nav").classList.remove("is-open"); $("#nav-toggle").setAttribute("aria-expanded", "false"); }
  });

  /* Fejléc vonala görgetéskor, aktuális szekció kiemelése */
  window.addEventListener("scroll", () => $("#site-header").classList.toggle("is-scrolled", window.scrollY > 8), { passive: true });
  let io = null;
  function observeSections() {
    if (io) io.disconnect();
    if (!("IntersectionObserver" in window)) return;
    io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        $$("[data-nav]").forEach((a) => a.classList.toggle("is-current", a.dataset.nav === en.target.id));
      });
    }, { rootMargin: "-40% 0px -55% 0px" });
    ["menu", "info", "about", "allergens", "faq"].forEach((id) => io.observe(document.getElementById(id)));
  }
  (function revealSections() {
    if (!("IntersectionObserver" in window)) return;
    const els = $$(".section");
    els.forEach((el) => el.classList.add("reveal"));
    const ro = new IntersectionObserver((entries) => {
      entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("is-in"); ro.unobserve(en.target); } });
    }, { rootMargin: "0px 0px -12% 0px" });
    els.forEach((el) => ro.observe(el));
  })();

  /* Nyitvatartási állapot percenkénti frissítése */
  setInterval(() => { const s = $("#status"); if (s) s.textContent = statusText(); }, 60000);

  renderAll();
})();

  </script>

  :root:not([data-theme="light"]) {
    --bg: #161412; --surface: #1e1b18; --ink: #ece7df; --muted: #a8a096; --line: #36312b; --field: #80776c;
    --accent: #ec8f74; --dough: #3a3024; --ok: #9fcf94; --backdrop: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161412; --surface: #1e1b18; --ink: #ece7df; --muted: #a8a096; --line: #36312b; --field: #80776c;
  --accent: #ec8f74; --dough: #3a3024; --ok: #9fcf94; --backdrop: rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* =====================================================================
   ALAP / BASE
===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
:root {
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
html:has(dialog[open]) { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1.0625rem/1.55 var(--sans);
}
h1, h2, h3, h4, p, ul, ol, dl, dd, figure, fieldset { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
legend { padding: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
img, svg { max-width: 100%; }
::selection { background: var(--dough); color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); }
.muted { color: var(--muted); }
.small { font-size: 0.9375rem; }
.serif { font-family: var(--serif); font-weight: 400; }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }

.skip {
  position: fixed; left: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 100;
  background: var(--ink); color: var(--bg); padding: 10px 16px; text-decoration: none; transform: translateY(-200%);
}
.skip:focus { transform: none; }

/* Gombok / buttons — laposak, árnyék nélkül */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); border-radius: 2px;
  background: transparent; color: var(--ink); font-weight: 600; font-size: 0.9688rem; text-decoration: none; cursor: pointer;
}
.btn:hover { background: var(--ink); color: var(--bg); }
.btn-solid { background: var(--ink); color: var(--bg); }
.btn-solid:hover { background: transparent; color: var(--ink); }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 0.9375rem; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.swap { display: inline-grid; place-items: center; overflow: hidden; }
.swap > span { grid-area: 1 / 1; white-space: nowrap; }
.swap-b { opacity: 0; transform: translateY(110%); }
.swap.is-added .swap-a { opacity: 0; transform: translateY(-110%); }
.swap.is-added .swap-b { opacity: 1; transform: none; }
.btn-solid.swap.is-added { background: transparent; color: var(--ink); }
.link {
  display: inline-flex; align-items: center; min-height: 32px; padding: 0; border: 0; background: none; cursor: pointer;
  color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; font-weight: 500;
}
.link:hover { text-decoration-thickness: 2px; }

/* =====================================================================
   FEJLÉC / HEADER
===================================================================== */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid transparent;
}
.site-header.is-scrolled { border-bottom-color: var(--line); }
.header-in { display: flex; align-items: center; gap: 24px; min-height: 68px; }
.brand { text-decoration: none; margin-right: auto; line-height: 1.15; padding: 6px 0; }
.brand b { display: block; font: 400 1.375rem/1.1 var(--serif); }
.brand span { display: block; font-size: 0.8125rem; color: var(--muted); }
.nav ul { display: flex; gap: 22px; }
.nav a { position: relative; text-decoration: none; font-size: 0.9688rem; padding: 10px 0; display: inline-block; }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 1px; background: var(--ink); transform: scaleX(0); transform-origin: left; }
.nav a:hover::after, .nav a.is-current::after { transform: scaleX(1); }
.tools { display: flex; align-items: center; gap: 16px; }
.cart-btn .count-box { display: inline-block; overflow: hidden; vertical-align: bottom; line-height: 1.25; }
.cart-btn .count { display: inline-block; font-variant-numeric: tabular-nums; }
.nav-toggle { display: none; }
@media (max-width: 880px) {
  .header-in { flex-wrap: wrap; gap: 8px 16px; }
  .nav-toggle { display: inline-flex; }
  .nav { order: 3; width: 100%; display: none; padding-bottom: 12px; }
  .nav.is-open { display: block; }
  .nav ul { flex-direction: column; gap: 0; }
  .nav a { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .tools .theme-btn, .tools .lang-btn { display: none; }
  .nav .mobile-tools { display: flex; gap: 20px; padding-top: 12px; }
}
@media (min-width: 881px) { .nav .mobile-tools { display: none; } }

/* =====================================================================
   SZEKCIÓK / SECTIONS
===================================================================== */
.section { padding: clamp(64px, 9vw, 112px) 0; border-top: 1px solid var(--line); }
.section-grid { display: grid; grid-template-columns: 1fr; gap: 28px 48px; }
@media (min-width: 900px) { .section-grid { grid-template-columns: 4fr 8fr; } }
.section-grid > * { min-width: 0; }
.h2 { font: 400 clamp(1.875rem, 3.4vw, 2.625rem)/1.1 var(--serif); letter-spacing: -0.005em; }
.lead { font-size: 1.125rem; color: var(--muted); max-width: 56ch; }

/* Nyitó / hero */
.hero { padding: clamp(48px, 8vw, 104px) 0 clamp(48px, 7vw, 88px); }
.hero-grid { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: center; }
@media (min-width: 900px) { .hero-grid { grid-template-columns: 7fr 5fr; } }
.status { font-size: 0.9375rem; color: var(--muted); }
.status b { color: var(--ink); font-weight: 600; }
.status span { white-space: nowrap; }
.h1 { font: 400 clamp(2.5rem, 6.2vw, 4.75rem)/1.04 var(--serif); letter-spacing: -0.015em; max-width: 13ch; margin-top: 20px; }
.hero .lead { margin-top: 24px; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 32px; }
.drawing { width: min(380px, 80%); justify-self: center; color: var(--ink); }
.drawing .dough { fill: var(--dough); }
.drawing .cream { fill: #fbf6ec; }
.drawing .cheese { stroke: #b4831f; }
.facts { display: grid; grid-template-columns: 1fr; gap: 0; margin-top: clamp(48px, 7vw, 80px); }
@media (min-width: 700px) { .facts { grid-template-columns: repeat(3, 1fr); gap: 32px; } }
.facts li { border-top: 1px solid var(--ink); padding: 14px 0 18px; }
.facts b { display: block; font-weight: 600; }
.facts span { color: var(--muted); font-size: 0.9688rem; }

/* Lángosok / menu */
.toolbar { display: grid; gap: 18px; margin-top: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.filters button {
  border: 0; background: none; padding: 8px 0; min-height: 40px; cursor: pointer; font-size: 0.9688rem;
  border-bottom: 1px solid transparent; color: var(--muted);
}
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { color: var(--ink); border-bottom: 2px solid var(--ink); font-weight: 600; }
.toolbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; font-size: 0.9375rem; }
.toolbar-row legend, .toolbar-row .label { color: var(--muted); margin-right: 4px; float: left; padding: 10px 14px 0 0; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; margin-right: 18px; cursor: pointer; }
.check input, .choice input { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); flex: none; }
select {
  min-height: 40px; padding: 0 34px 0 10px; border: 1px solid var(--field); border-radius: 2px; background-color: var(--surface);
  appearance: none; -webkit-appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat;
}
.result-count { margin-top: 40px; font-size: 0.9375rem; color: var(--muted); }
.menu-list { display: grid; grid-template-columns: 1fr; column-gap: 56px; margin-top: 12px; }
@media (min-width: 820px) { .menu-list { grid-template-columns: 1fr 1fr; column-gap: 72px; } }
.item { border-top: 1px solid var(--line); padding: 22px 0 24px; }
.item-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.item-head h3 { font: 400 1.375rem/1.2 var(--serif); }
.item-price { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.item-desc { margin-top: 6px; color: var(--muted); max-width: 46ch; }
.item-meta { margin-top: 8px; font-size: 0.875rem; color: var(--muted); }
.fav { color: var(--accent); font-weight: 600; }
.item-actions { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
.empty { padding: 32px 0; border-top: 1px solid var(--line); }

/* Átvétel / info */
.info-cols { display: grid; grid-template-columns: 1fr; gap: 28px; }
@media (min-width: 700px) { .info-cols { grid-template-columns: repeat(3, 1fr); } }
.info-cols h3, .h3 { font-weight: 600; font-size: 1.0625rem; }
.info-cols p { margin-top: 6px; color: var(--muted); }
.hours { margin-top: 48px; max-width: 460px; }
.hours table { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
.hours th, .hours td { text-align: left; font-weight: 400; padding: 9px 0; border-bottom: 1px solid var(--line); }
.hours td { text-align: right; }
.hours tr.is-today th, .hours tr.is-today td { font-weight: 700; }

/* Rólam / about */
.about p + p { margin-top: 16px; }
.about p { font-size: 1.125rem; max-width: 60ch; }

/* Allergének / tables */
.table-scroll { position: relative; overflow-x: auto; margin-top: 28px; }
.table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 0.9688rem; }
.table caption { text-align: left; font-weight: 600; padding-bottom: 10px; }
.table th, .table td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.table thead th { font-weight: 600; color: var(--muted); font-size: 0.875rem; border-bottom-color: var(--ink); }
.table tbody th { font-weight: 400; }
.table .c { text-align: center; padding-right: 0; width: 13%; }
.legend { columns: 2 220px; column-gap: 32px; margin-top: 12px; }
.legend li { padding: 4px 0; break-inside: avoid; }
.legend b { display: inline-block; min-width: 1.8em; font-variant-numeric: tabular-nums; }

/* Kérdések / FAQ */
.faq details { border-top: 1px solid var(--line); }
.faq details:last-child { border-bottom: 1px solid var(--line); }
.faq summary {
  list-style: none; cursor: pointer; padding: 16px 32px 16px 0; position: relative; font-weight: 600;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::before, .faq summary::after {
  content: ""; position: absolute; right: 6px; top: 50%; width: 13px; height: 1.5px; background: currentColor;
}
.faq summary::after { transform: rotate(90deg); }
.faq details[open] summary::after { transform: rotate(0deg); }
.faq details p { padding: 0 0 18px; color: var(--muted); max-width: 62ch; }

/* Lábléc / footer */
.footer { border-top: 1px solid var(--ink); padding: 48px 0 40px; font-size: 0.9375rem; }
.footer-grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
@media (min-width: 760px) { .footer-grid { grid-template-columns: 1.3fr 1fr 1fr 1fr; } }
.footer h2 { font-size: 0.9375rem; font-weight: 600; margin-bottom: 8px; }
.footer p, .footer li { color: var(--muted); }
.footer li + li { margin-top: 2px; }
.footer-bottom { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.875rem; }

/* =====================================================================
   ABLAKOK / DIALOGS
===================================================================== */
dialog {
  padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--ink);
  width: min(640px, calc(100% - 24px)); max-height: calc(100dvh - 24px); overflow: auto; overscroll-behavior: contain;
}
dialog::backdrop { background: var(--backdrop); }
dialog.drawer {
  margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(440px, 100%); border-radius: 0; border-width: 0 0 0 1px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 0; }
.d-head h2 { font: 400 1.75rem/1.15 var(--serif); }
.d-body { padding: 16px 24px 24px; }
.d-foot {
  position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 24px; background: var(--surface); border-top: 1px solid var(--line);
}
.group { margin-top: 26px; }
.group > legend, .group > .h3 { font-weight: 600; font-size: 1.0625rem; margin-bottom: 4px; }
.help { font-size: 0.875rem; color: var(--muted); margin-top: 4px; }
.choice { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.choice:first-of-type { border-top: 1px solid var(--line); }
.choice .grow { flex: 1; }
.choice small { color: var(--muted); font-size: 0.875rem; margin-left: 6px; }
.choice .price { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.choice.keep:has(input:not(:checked)) .grow { text-decoration: line-through; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--field); border-radius: 2px; }
.stepper button { width: 40px; height: 40px; border: 0; background: none; cursor: pointer; font-size: 1.125rem; }
.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
.stepper output, .stepper .q { min-width: 2.2em; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.field { margin-top: 16px; }
.field label { display: block; font-weight: 600; font-size: 0.9688rem; margin-bottom: 6px; }
.req { color: var(--accent); }
.input, textarea.input {
  display: block; width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--field); border-radius: 2px; background: var(--bg);
}
textarea.input { min-height: 80px; resize: vertical; }
.input[aria-invalid="true"] { border: 2px solid var(--accent); }
.error { color: var(--accent); font-size: 0.9375rem; font-weight: 600; margin-top: 6px; }
.error-box { border: 2px solid var(--accent); padding: 14px 16px; margin-top: 16px; }
.error-box ul { list-style: disc; padding-left: 20px; margin-top: 4px; }
.row2 { display: grid; gap: 0 16px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .row2 { grid-template-columns: 1fr 1fr; } .row2.zip { grid-template-columns: 8rem 1fr; } }
.lines li { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.lines .name { font-weight: 600; }
.lines .detail { grid-column: 1 / -1; font-size: 0.875rem; color: var(--muted); }
.lines .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; margin-top: 6px; }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; margin-top: 16px; font-variant-numeric: tabular-nums; }
.totals dd { text-align: right; }
.totals .grand { font-weight: 700; font-size: 1.125rem; padding-top: 8px; border-top: 1px solid var(--ink); margin-top: 6px; }
.notice { border-left: 2px solid var(--line); padding: 4px 0 4px 12px; color: var(--muted); font-size: 0.9375rem; margin-top: 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 20px; border-bottom: 1px solid var(--line); margin-top: 12px; }
.tabs button { border: 0; background: none; padding: 10px 0; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.legal h3 { font-weight: 600; margin-top: 22px; }
.legal p { margin-top: 6px; max-width: 70ch; }
.legal .doc-title { font: 400 1.5rem/1.2 var(--serif); margin-top: 20px; }

/* =====================================================================
   ANIMÁCIÓK / MOTION
   Rövidek és visszafogottak. Ha a rendszer csökkentett mozgást kér,
   egyik sem fut (minden azonnal a végállapotában jelenik meg).
===================================================================== */
@media (prefers-reduced-motion: no-preference) {
  body, .site-header { transition: background-color .25s ease, color .25s ease; }
  .btn { transition: background-color .15s ease, color .15s ease, transform .1s ease; }
  .btn:active { transform: translateY(1px); }
  .link { transition: text-decoration-color .15s ease, text-decoration-thickness .15s ease; }
  .filters button { transition: color .15s ease; }
  .nav a::after { transition: transform .28s cubic-bezier(.2, .7, .2, 1); }
  .site-header { transition: border-color .2s ease, background-color .25s ease; }

  /* Kosárba gomb: a felirat felcsúszik, megjelenik a „Hozzáadva ✓” */
  .swap > span { transition: transform .32s cubic-bezier(.2, .7, .2, 1), opacity .2s ease; }

  /* Kosár darabszám: az új szám beúszik */
  .count.tick-up { animation: tick-up .34s cubic-bezier(.2, .7, .2, 1); }
  .count.tick-down { animation: tick-down .34s cubic-bezier(.2, .7, .2, 1); }

  /* Nyitóoldal: első betöltéskor a szöveg finoman felúszik, a rajz „megrajzolódik” */
  .intro .in { animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--d, 0) * 90ms + 60ms); }
  .intro .draw { stroke-dasharray: 1; animation: draw var(--dl, .6s) cubic-bezier(.55, .1, .3, 1) both; animation-delay: var(--dd, 0s); }
  .intro .dough { animation-name: draw, fill-in; animation-duration: var(--dl), .7s; animation-delay: var(--dd), .95s; animation-fill-mode: both; }
  .intro .cream { animation-name: draw, fill-in; animation-duration: var(--dl), .5s; animation-delay: var(--dd), 1.9s; animation-fill-mode: both; }
  .intro .sprinkle { animation: pop .45s ease both; animation-delay: var(--dd); }

  /* Szekciók: egyszer, finoman beúsznak görgetéskor */
  .section.reveal > .wrap { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .7s cubic-bezier(.2, .7, .2, 1); }
  .section.reveal.is-in > .wrap { opacity: 1; transform: none; }

  /* Lángoslista: szűréskor a tételek egymás után jelennek meg */
  .item { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 35ms); }

  /* Kérdések: a + jel mínusszá fordul, a válasz lenyílik (ahol a böngésző tudja) */
  .faq summary::after { transition: transform .25s ease; }
  :root { interpolate-size: allow-keywords; }
  .faq details::details-content { block-size: 0; overflow: hidden; transition: block-size .3s ease, content-visibility .3s allow-discrete; }
  .faq details[open]::details-content { block-size: auto; }

  /* Ablakok: nyitáskor felúsznak, a kosár oldalról csúszik be */
  dialog[open] { animation: dlg-in .22s cubic-bezier(.2, .7, .2, 1); }
  dialog[open]::backdrop { animation: fade-in .22s ease; }
  dialog.drawer[open] { animation: drawer-in .3s cubic-bezier(.2, .7, .2, 1); }
  dialog.is-closing { animation: dlg-out .19s ease forwards; }
  dialog.drawer.is-closing { animation: drawer-out .19s ease-in forwards; }
  dialog.is-closing::backdrop { animation: fade-out .19s ease forwards; }

  /* Kosártétel törlése */
  .lines li.is-leaving { animation: leave .22s ease forwards; }

  /* Rendelés kész: kézzel húzott pipa */
  .done-check .draw { stroke-dasharray: 1; animation: draw .6s cubic-bezier(.55, .1, .3, 1) both; animation-delay: var(--dd, 0s); }
}
.done-check { width: 44px; height: 44px; margin-bottom: 8px; fill: none; stroke: var(--ok); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes draw { 0% { stroke-dashoffset: 1; stroke-opacity: 0; } 3% { stroke-opacity: 1; } 100% { stroke-dashoffset: 0; stroke-opacity: 1; } }
@keyframes fill-in { from { fill-opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
@keyframes tick-up { from { transform: translateY(100%); opacity: 0; } }
@keyframes tick-down { from { transform: translateY(-100%); opacity: 0; } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes dlg-in { from { opacity: 0; transform: translateY(10px); } }
@keyframes dlg-out { to { opacity: 0; transform: translateY(8px); } }
@keyframes drawer-in { from { transform: translateX(100%); } }
@keyframes drawer-out { to { transform: translateX(100%); } }
@keyframes leave { to { opacity: 0; transform: translateX(14px); } }

  </style>
</head>

/* --------------------------- Nyitvatartás / hours --------------------------- */
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (h, m = 0) => `${h}:${pad(m)}`;
function openStatus(now) {
    const today = HOURS[now.getDay()];
    const mins = now.getHours() * 60 + now.getMinutes();
    if (today && mins >= today[0] * 60 && mins < today[1] * 60)
        return { open: true, closeAt: hhmm(today[1]) };
    for (let d = 0; d < 8; d++) {
        const date = new Date(now);
        date.setDate(now.getDate() + d);
        const h = HOURS[date.getDay()];
        if (!h)
            continue;
        if (d === 0 && mins >= h[0] * 60)
            continue;
        return { open: false, inDays: d, weekday: date.getDay(), openAt: hhmm(h[0]) };
    }
    return { open: false, inDays: 1, weekday: 2, openAt: "10:00" };
}
function orderSlots(now) {
    for (let d = 0; d < 8; d++) {
        const date = new Date(now);
        date.setDate(now.getDate() + d);
        date.setHours(0, 0, 0, 0);
        const h = HOURS[date.getDay()];
        if (!h)
            continue;
        let start = h[0] * 60 + 30;
        const end = h[1] * 60 - 15;
        if (d === 0) {
            const earliest = now.getHours() * 60 + now.getMinutes() + 30;
            start = Math.max(start, Math.ceil(earliest / 15) * 15);
        }
        if (start > end)
            continue;
        const slots = [];
        for (let m = start; m <= end; m += 15) {
            const label = hhmm(Math.floor(m / 60), m % 60);
            slots.push({ value: `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${label}`, label });
        }
        const nowMins = now.getHours() * 60 + now.getMinutes();
        const todayH = HOURS[now.getDay()];
        const asap = d === 0 && !!todayH && nowMins >= todayH[0] * 60 && nowMins + 30 <= todayH[1] * 60;
        return { inDays: d, weekday: date.getDay(), slots, asap };
    }
    return { inDays: 0, weekday: now.getDay(), slots: [], asap: false };
}

(function () {
  "use strict";

  /* ---------- segédfüggvények / helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* nincs tárhely */ } },
  };

  /* Animációk: csak ha a rendszer nem kér csökkentett mozgást */
  const motionOK = () => !window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const later = (fn, ms) => (motionOK() ? setTimeout(fn, ms) : fn());

  /* ---------- állapot / state ---------- */
  const state = {
    lang: store.get("pm-lang") === "en" ? "en" : "hu",
    cart: loadCart(),
    filter: "all",
    exclude: [],
    sort: "rec",
    navOpen: false,
  };
  let T = TEXTS[state.lang];
  let money = makeMoney();

  function makeMoney() {
    const nf = new Intl.NumberFormat(T.locale, { style: "currency", currency: "HUF", minimumFractionDigits: 0, maximumFractionDigits: 0 });
    return (n) => nf.format(n);
  }
  const L = (obj) => obj[state.lang];

  /* ---------- kosár / cart ---------- */
  function loadCart() {
    try {
      const raw = store.get("pm-cart-v2");
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list.filter((l) => PRODUCT_BY_ID[l.productId] && l.qty > 0) : [];
    } catch (e) { return []; }
  }
  const saveCart = () => store.set("pm-cart-v2", JSON.stringify(state.cart));
  const cartCount = () => state.cart.reduce((s, l) => s + l.qty, 0);
  const cartTotal = () => state.cart.reduce((s, l) => s + unitPrice(l) * l.qty, 0);

  function addLine(cfg, qty) {
    const key = lineKey(cfg);
    const ex = state.cart.find((l) => l.key === key);
    if (ex) ex.qty = Math.min(30, ex.qty + qty);
    else state.cart.push(Object.assign({}, cfg, { key, qty }));
    cartChanged();
  }
  function replaceLine(oldKey, cfg, qty) {
    const idx = state.cart.findIndex((l) => l.key === oldKey);
    state.cart = state.cart.filter((l) => l.key !== oldKey);
    const key = lineKey(cfg);
    const ex = state.cart.find((l) => l.key === key);
    if (ex) ex.qty = Math.min(30, ex.qty + qty);
    else state.cart.splice(idx < 0 ? state.cart.length : idx, 0, Object.assign({}, cfg, { key, qty }));
    cartChanged();
  }
  function setQty(key, qty) {
    if (qty <= 0) state.cart = state.cart.filter((l) => l.key !== key);
    else { const l = state.cart.find((x) => x.key === key); if (l) l.qty = Math.min(30, qty); }
    cartChanged();
  }
  function cartChanged() {
    saveCart();
    renderCartButton(true);
    if ($("#cart-dialog").open) renderCart();
  }

  /* ---------- képernyőolvasó-bejelentés / announcements ---------- */
  function announce(msg) {
    const el = $("#live");
    el.textContent = "";
    setTimeout(() => { el.textContent = msg; }, 50);
  }

  /* Újrarajzolás úgy, hogy a fókusz megmaradjon (azonos id alapján). */
  function renderInto(el, html) {
    const id = document.activeElement && el.contains(document.activeElement) ? document.activeElement.id : null;
    el.innerHTML = html;
    if (id) { const again = document.getElementById(id); if (again) again.focus(); else return false; }
    return true;
  }

  /* ---------- ablakok / dialogs ---------- */
  const returnFocus = new Map();
  function openDialog(dlg, trigger) {
    returnFocus.set(dlg, trigger || document.activeElement);
    if (!dlg.open) dlg.showModal();
    const first = dlg.querySelector("[data-autofocus]") || dlg.querySelector("h2");
    if (first) { if (!first.hasAttribute("tabindex") && first.tagName === "H2") first.setAttribute("tabindex", "-1"); first.focus(); }
  }
  function closeDialog(dlg, instant) {
    if (!dlg.open || dlg.classList.contains("is-closing")) return;
    if (instant || !motionOK()) { dlg.close(); return; }
    dlg.classList.add("is-closing");
    setTimeout(() => { dlg.classList.remove("is-closing"); dlg.close(); }, 190);
  }
  $$("dialog").forEach((dlg) => {
    dlg.addEventListener("close", () => {
      const el = returnFocus.get(dlg);
      if (dlg.id === "checkout-dialog") onCheckoutClosed();
      const target = el && (document.contains(el) ? el : el.id ? document.getElementById(el.id) : null);
      if (target) target.focus();
    });
    dlg.addEventListener("click", (e) => { if (e.target === dlg) closeDialog(dlg); });
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); closeDialog(dlg); });
  });

  /* =================================================================

  }

  let lastCount = null;
  function renderCartButton(animate) {
    const b = $("#cart-btn");
    if (!b) return;
    const n = cartCount();
    const dir = animate && lastCount !== null && n !== lastCount ? (n > lastCount ? "up" : "down") : "";

    b.innerHTML = `${esc(T.cart)} <span class="count-box"><span class="count ${dir ? "tick-" + dir : ""}">${n}</span></span><span class="sr-only"> ${esc(T.cartUi.pcs)}</span>`;
  }

  /* Kézzel rajzolt lángos – egyszerű vonalas SVG */
