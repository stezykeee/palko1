s \xfczlet: ${k}`,`Nyilv\xe1ntart\xe1si sz\xe1m: ${e(z)}`,`Ad\xf3sz\xe1m: ${e(N)}`,`Telefon: ${x}, e-mail: ${S}`]},{h:"Tárhelyszolgáltató",p:[e(E)]},{h:"Szerzői jog",p:["Az oldal szövegei és rajzai a szolgáltató tulajdonát képezik, engedély nélkül nem használhatók fel."]}]},terms:{title:"Általános Szerződési Feltételek (ÁSZF)",updated:"Hatályos: 2026. október 6-tól",sections:[{h:"1. Kik vagyunk, mire vonatkozik",p:["Ez az ÁSZF a Palkó Marcsi lángosozó webshopjában leadott rendelésekre vonatkozik. A szolgáltató adatait az Impresszum tartalmazza.","A szerződés nyelve magyar. A szerződés elektronikus úton jön létre, nem minősül írásba foglaltnak, és nem iktatjuk. Magatartási kódexnek nem vetettük alá magunkat."]},{h:"2. Termékek és árak",p:["A lángosokat rendelésre, frissen készítjük. A rajzok illusztrációk.","Az árak forintban értendő bruttó árak, az áfát tartalmazzák. A feltétek és az óriás méret felára a termék testreszabásakor látható.","Nyilvánvalóan hibás ár (például 0 Ft) esetén nem vagyunk kötelesek a terméket ezen az áron teljesíteni; ilyenkor felajánljuk a helyes árat, vagy a rendelést lemondhatod."]},{h:"3. A rendelés menete",p:["Válaszd ki és szükség szerint szabd testre a lángost, tedd a kosárba, majd a pénztárban add meg az átvétel módját, az időpontot és az adataidat.","A rendelés elküldése előtt az összesítő oldalon minden adatot ellenőrizhetsz, és a „Vissza” gombbal vagy a kosárban javíthatod.","A „Megrendelés fizetési kötelezettséggel” gomb megnyomásával fizetési kötelezettséggel járó ajánlatot teszel. A rendelést e-mailben haladéktalanul visszaigazoljuk; ha a visszaigazolás 48 órán belül nem érkezik meg, mentesülsz az ajánlati kötöttség alól."]},{h:"4. Fizetés",p:["Átvételkor fizethetsz készpénzzel, bankkártyával vagy SZÉP-kártyával. Online fizetésre jelenleg nincs lehetőség.","A vásárlásról nyugtát vagy kérésre számlát adunk."]},{h:"5. Átvétel és kiszállítás",p:[`Szem\xe9lyes \xe1tv\xe9tel d\xedjtalanul: ${k}`,`Kisz\xe1ll\xedt\xe1s kb. 5 km-es k\xf6rzetben, d\xedja ${lI(690)}, ${lI(6e3)} feletti rendel\xe9sn\xe9l ingyenes. A megadott idők t\xe1j\xe9koztat\xf3 jellegűek.`,"Ha a futár a megadott címen nem ér el, telefonon keres. Sikertelen kézbesítés esetén is kérjük a rendelés kifizetését, mert az étel egyedileg készült."]},{h:"6. Elállási jog",p:["A 45/2014. (II. 26.) Korm. rendelet 29. § (1) bekezdés c) és d) pontja alapján a fogyasztó kérésére egyedileg előállított, valamint romlandó, rövid ideig eltartható termékre a 14 napos elállási jog nem vonatkozik. A lángos ilyen termék."]},{h:"7. Minőségi kifogás és panaszkezelés",p:[`Ha a rendel\xe9ssel gond van, k\xe9rj\xfck, azonnal jelezd telefonon (${x}) vagy e-mailben (${S}). A hib\xe1s vagy hi\xe1nyos teljes\xedt\xe9st kicser\xe9lj\xfck vagy j\xf3v\xe1\xedrjuk.`,"A szóbeli panaszt azonnal kivizsgáljuk. Az írásbeli panaszra 30 napon belül írásban válaszolunk, és a panaszról jegyzőkönyvet veszünk fel, amelyet a jogszabályban előírt ideig megőrzünk."]},{h:"8. Jogorvoslat",p:["Fogyasztói panasszal a lakóhelyed szerint illetékes vármegyei kormányhivatalhoz mint fogyasztóvédelmi hatósághoz fordulhatsz.",`Vit\xe1s \xfcgyben a b\xe9k\xe9ltető test\xfclethez is fordulhatsz: ${e(C)}`,"Ezen kívül bírósághoz is fordulhatsz a polgári perrendtartás szabályai szerint."]}]},privacy:{title:"Adatkezelési tájékoztató",updated:"Hatályos: 2026. október 6-tól",sections:[{h:"1. Az adatkezelő",p:[`${e(j)}, ${k}. El\xe9rhetős\xe9g: ${S}, ${x}.`,"Az adataidat az Európai Parlament és a Tanács (EU) 2016/679 rendelete (GDPR) és az információs önrendelkezési jogról szóló 2011. évi CXII. törvény (Infotv.) szerint kezeljük."]},{h:"2. Rendelés teljesítése",p:["Kezelt adatok: név, telefonszám, e-mail-cím, kiszállításnál a cím, a rendelés tartalma és a megjegyzések.","Cél: a rendelés elkészítése, átadása vagy kiszállítása, kapcsolattartás a rendeléssel kapcsolatban.","Jogalap: szerződés teljesítése, GDPR 6. cikk (1) bekezdés b) pont. Az adatok megadása nélkül nem tudunk rendelést teljesíteni.","Időtartam: a teljesítéstől számított 5 évig (a Ptk. szerinti általános elévülési idő)."]},{h:"3. Számviteli bizonylatok",p:["Kezelt adatok: a nyugtán vagy számlán szereplő adatok.","Jogalap: jogi kötelezettség teljesítése, GDPR 6. cikk (1) bekezdés c) pont, a számvitelről szóló 2000. évi C. törvény 169. §-a alapján.","Időtartam: 8 év."]},{h:"4. Hírlevél (nem kötelező)",p:["Kezelt adat: e-mail-cím, név. Cél: tájékoztatás az új ízekről.","Jogalap: hozzájárulásod, GDPR 6. cikk (1) bekezdés a) pont. Hozzájárulásodat bármikor, indoklás nélkül visszavonhatod a levelek alján lévő linkkel vagy e-mailben; ez nem érinti a korábbi adatkezelés jogszerűségét.","Időtartam: a hozzájárulás visszavonásáig."]},{h:"5. Sütik és helyi tárolás",p:["Nem használunk analitikai, reklám- vagy követő sütiket, és harmadik féltől származó betűtípust vagy szkriptet sem töltünk be.","A kosár tartalmát, a választott nyelvet, témát és az animációs beállítást a böngésződ helyi tárhelye (localStorage) őrzi meg. Ezek az adatok nem jutnak el hozzánk, a működéshez szükségesek, és a böngésző beállításaiban bármikor törölheted őket."]},{h:"6. Adatfeldolgozók és címzettek",p:[`Az adatokat csak a feladatukhoz sz\xfcks\xe9ges m\xe9rt\xe9kben ismerhetik meg: ${e(P)}; t\xe1rhely: ${e(E)}.`,"Adataidat nem adjuk el, és nem továbbítjuk az Európai Gazdasági Térségen kívülre."]},{h:"7. Adatbiztonság",p:["Az oldal titkosított (HTTPS) kapcsolaton érhető el. Az adatokhoz csak az fér hozzá, akinek a rendelés teljesítéséhez szüksége van rájuk."]},{h:"8. A jogaid",p:["Kérheted a hozzáférést az adataidhoz (15. cikk), azok helyesbítését (16. cikk), törlését (17. cikk), a kezelés korlátozását (18. cikk), az adathordozhatóságot (20. cikk), és tiltakozhatsz az adatkezelés ellen (21. cikk).",`K\xe9r\xe9sedre egy h\xf3napon bel\xfcl v\xe1laszolunk (12. cikk). \xcdrj a ${S} c\xedmre.`]},{h:"9. Jogorvoslat",p:["Panasszal a Nemzeti Adatvédelmi és Információszabadság Hatósághoz fordulhatsz: 1055 Budapest, Falk Miksa utca 9–11.; postacím: 1363 Budapest, Pf. 9.; telefon: +36 1 391 1400; e-mail: ugyfelszolgalat@naih.hu; www.naih.hu.","Jogaid megsértése esetén bírósághoz is fordulhatsz; a pert a lakóhelyed szerint illetékes törvényszék előtt is megindíthatod."]}]},a11y:{title:"Akadálymentességi nyilatkozat",updated:"Utolsó felülvizsgálat: 2026. október 6., önértékelés alapján",sections:[{h:"Célunk",p:["Azt szeretnénk, hogy mindenki egyedül, segítség nélkül tudjon lángost rendelni. Az oldalt a WCAG 2.1 irányelv AA szintjének megfelelően készítettük, az Európai Akadálymentesítési Irányelv ((EU) 2019/882) szem előtt tartásával."]},{h:"Amit megtettünk",p:["Az oldal teljes egészében billentyűzettel használható, a fókusz mindig jól látható, és az oldal elején egy „Ugrás a tartalomra” link segíti a navigációt.","A szövegek és a háttér kontrasztja legalább 4,5:1, mindkét témában. A színek mellett mindig szöveg is jelzi az információt, például az allergéneknél.","Az animációk az oldal tetején szüneteltethetők, és alapból kikapcsolnak, ha a rendszered csökkentett mozgást kér.","Az oldal 200%-os nagyításnál és mobilon is használható. Az űrlapmezőknek látható címkéjük van, a hibaüzenetek pontosan megmondják, mit kell javítani.","A kosár változásait a képernyőolvasók is bejelentik. A nyelvváltás az oldal nyelvi beállítását is módosítja."]},{h:"Ismert korlátok",p:["A lángosrajzok díszítő elemek; minden információjuk szövegesen is elérhető. Ha bármilyen akadályba ütközöl, kérjük, jelezd."]},{h:"Visszajelzés",p:[`\xcdrj a ${S} c\xedmre vagy h\xedvj a ${x} sz\xe1mon. 8 munkanapon bel\xfcl v\xe1laszolunk, \xe9s ha kell, telefonon felvessz\xfck a rendel\xe9sed.`]}]}}:{impressum:{title:"Legal notice",updated:"Effective from 6 October 2026",sections:[{h:"Service provider",p:[`Name: ${e(j)}`,`Registered office and shop: ${k}`,`Registration number: ${e(z)}`,`Tax number: ${e(N)}`,`Phone: ${x}, email: ${S}`]},{h:"Hosting provider",p:[e(E)]},{h:"Copyright",p:["The texts and illustrations on this site belong to the service provider and may not be used without permission."]},{h:"Language",p:["This English version is provided for convenience. The Hungarian version is legally binding."]}]},terms:{title:"Terms and Conditions",updated:"Effective from 6 October 2026",sections:[{h:"1. Who we are",p:["These terms apply to orders placed in the Palkó Marcsi lángos webshop. Provider details are in the Legal notice.","The contract is concluded electronically in Hungarian, is not considered a written contract and is not filed. We have not subscribed to any code of conduct."]},{h:"2. Products and prices",p:["We make every lángos fresh, to order. Illustrations are for guidance only.","Prices are gross prices in Hungarian forints and include VAT. Topping and giant-size surcharges are shown when you customise a product.","If a price is obviously wrong (for example HUF 0), we are not obliged to sell at that price; we'll offer the correct price or you can cancel."]},{h:"3. How ordering works",p:["Choose and customise your lángos, add it to the cart, then at checkout enter how and when you want it and your details.","Before sending, you can check everything on the review step and correct it with the Back button or in the cart.","Pressing “Place order with obligation to pay” makes an offer that involves an obligation to pay. We confirm orders by email without delay; if you don't receive a confirmation within 48 hours, you are released from your offer."]},{h:"4. Payment",p:["Pay on receipt with cash, bank card or SZÉP card. Online payment is not available yet. You'll get a receipt, or an invoice on request."]},{h:"5. Pickup and delivery",p:[`Free pickup: ${k}`,`Delivery within approx. 5 km costs ${lI(690)}, free on orders over ${lI(6e3)}. Times are estimates.`,"If the courier can't reach you, they'll call you. Food made to order must be paid for even if delivery fails."]},{h:"6. Right of withdrawal",p:["Under Section 29(1)(c) and (d) of Hungarian Government Decree 45/2014, the 14-day right of withdrawal does not apply to goods made to the consumer's specifications or goods that spoil quickly. Lángos is both."]},{h:"7. Quality issues and complaints",p:[`If something is wrong with your order, tell us right away by phone (${x}) or email (${S}). We'll replace or refund anything faulty or missing.`,"We handle verbal complaints immediately and reply to written complaints within 30 days."]},{h:"8. Remedies",p:["You can contact the consumer protection authority (the county government office for your place of residence).",`You can also turn to a conciliation board: ${e(C)}`,"You may also go to court."]}]},privacy:{title:"Privacy Notice",updated:"Effective from 6 October 2026",sections:[{h:"1. Controller",p:[`${e(j)}, ${k}. Contact: ${S}, ${x}.`,"We process your data under the EU General Data Protection Regulation (GDPR) and Hungarian Act CXII of 2011."]},{h:"2. Fulfilling your order",p:["Data: name, phone, email, delivery address (if delivered), order contents and notes.","Purpose: making, handing over or delivering your order and contacting you about it.","Legal basis: performance of a contract, GDPR Art. 6(1)(b). We can't fulfil an order without this data.","Retention: 5 years from fulfilment (the general limitation period under the Hungarian Civil Code)."]},{h:"3. Accounting records",p:["Data shown on receipts or invoices. Legal basis: legal obligation, GDPR Art. 6(1)(c) and Section 169 of Hungarian Act C of 2000 on Accounting. Retention: 8 years."]},{h:"4. Newsletter (optional)",p:["Data: email, name. Purpose: news about new flavours. Legal basis: your consent, GDPR Art. 6(1)(a). You can withdraw consent any time via the link in each email or by writing to us; this doesn't affect earlier processing. Retention: until you withdraw consent."]},{h:"5. Cookies and local storage",p:["We don't use analytics, advertising or tracking cookies, and we don't load fonts or scripts from third parties.","Your cart, language, theme and animation setting are kept in your browser's local storage. This data never reaches us, is needed for the site to work, and you can delete it in your browser settings at any time."]},{h:"6. Processors and recipients",p:[`Only where needed for their task: ${e(P)}; hosting: ${e(E)}.`,"We don't sell your data or transfer it outside the European Economic Area."]},{h:"7. Security",p:["The site uses an encrypted (HTTPS) connection. Only people who need your data to fulfil your order can access it."]},{h:"8. Your rights",p:["You can request access (Art. 15), rectification (Art. 16), erasure (Art. 17), restriction (Art. 18) and data portability (Art. 20), and you can object (Art. 21).",`We reply within one month (Art. 12). Write to ${S}.`]},{h:"9. Complaints",p:["You can complain to the Hungarian National Authority for Data Protection and Freedom of Information (NAIH): 1055 Budapest, Falk Miksa utca 9–11; postal address: 1363 Budapest, Pf. 9; phone +36 1 391 1400; email ugyfelszolgalat@naih.hu; www.naih.hu.","You can also go to court, including the regional court for your place of residence."]}]},a11y:{title:"Accessibility statement",updated:"Last reviewed 6 October 2026, by self-assessment",sections:[{h:"Our aim",p:["Everyone should be able to order lángos on their own, without help. This site is built to meet WCAG 2.1 level AA, with the European Accessibility Act ((EU) 2019/882) in mind."]},{h:"What we've done",p:["Everything works with a keyboard, focus is always clearly visible, and a “Skip to content” link sits at the top of the page.","Text contrast is at least 4.5:1 in both themes. Information is never shown by colour alone, for example in the allergen lists.","Animations can be paused at the top of the page and switch off automatically if your system asks for reduced motion.","The site works at 200% zoom and on phones. Form fields have visible labels, and error messages say exactly what to fix.","Cart changes are announced to screen readers. Switching language also updates the page language."]},{h:"Known limitations",p:["The lángos illustrations are decorative; all their information is also available as text. If anything gets in your way, please tell us."]},{h:"Feedback",p:[`Email ${S} or call ${x}. We reply within 8 working days and can take your order by phone if needed.`]}]}}),s=[["impressum",t.footer.impressum],["terms",t.footer.terms],["privacy",t.footer.privacy],["a11y",t.footer.a11y]];return(0,m.jsx)(n5,{open:!!r,onOpenChange:e=>{e||a(null)},title:t.legal.title,description:t.legal.desc,size:"sm",titleClassName:"display text-3xl px-6 pt-6 pr-16 block",children:(0,m.jsxs)(lv,{value:r??l,onValueChange:e=>a(e),className:"px-6 pb-8 pt-4",children:[(0,m.jsx)(lb,{className:"flex gap-2 overflow-x-auto pb-2","aria-label":t.legal.title,children:s.map(([e,t])=>(0,m.jsx)(lk,{value:e,className:"tab-btn",children:t},e))}),s.map(([e])=>{let n=i[e];return(0,m.jsxs)(lx,{value:e,className:"legal mt-4",tabIndex:0,children:[(0,m.jsx)("h3",{className:"!mt-2 display !text-2xl !font-normal",children:n.title}),(0,m.jsx)("p",{className:"text-sm",style:{color:"var(--ink-soft)"},children:n.updated}),(0,m.jsx)("p",{className:"placeholder-note mt-3",children:t.footer.demo}),n.sections.map(e=>(0,m.jsxs)("div",{children:[(0,m.jsx)("h4",{className:"font-extrabold text-[1.05rem] mt-5",children:e.h}),e.p.map((e,t)=>(0,m.jsx)("p",{children:e},t))]},e.h))]},e)})]})})}function lV(){let{t:e}=Z();return!function(){let{motion:e}=Z();(0,h.useEffect)(()=>{let t=document.getElementById("page-progress"),n=document.getElementById("ribbon-track"),r=document.querySelector(".rotor"),a=Array.from(document.querySelectorAll("[data-parallax]")),l=0,o=()=>{l=0;let o=window.scrollY,i=Math.max(1,document.documentElement.scrollHeight-window.innerHeight);if(t&&(t.style.transform=`scaleX(${Math.min(1,o/i)})`),!e){a.forEach(e=>e.style.transform=""),n&&(n.style.transform=""),r&&r.style.setProperty("--rotor","0deg");return}if(a.forEach(e=>{let t=parseFloat(e.dataset.parallax||"0");e.style.transform=`translate3d(0, ${(o*t).toFixed
